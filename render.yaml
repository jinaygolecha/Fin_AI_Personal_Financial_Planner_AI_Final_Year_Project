# ====================================================================
# FinPro — Personal Finance & AI Platform
# Render Blueprint Specification (render.yaml)
# Production Deployment with Supabase PostgreSQL
# ====================================================================

services:
  - type: web
    name: finpro-finance-ai
    runtime: node
    plan: free
    region: oregon
    buildCommand: npm --prefix node-backend install && npm --prefix node-backend run prisma:generate
    startCommand: cd node-backend && npm start
    healthCheckPath: /api/v1/health
    autoDeploy: true

    envVars:
      # Server Runtime
      - key: NODE_ENV
        value: production

      # Supabase PostgreSQL Database URL
      # Pooled connection string (port 6543 with pgbouncer=true or port 5432)
      - key: DATABASE_URL
        sync: false
      # Direct connection URL for migrations and schema synchronization (port 5432)
      - key: DIRECT_URL
        sync: false

      # Authentication Secrets
      - key: JWT_SECRET
        generateValue: true
      - key: JWT_REFRESH_SECRET
        generateValue: true
      - key: JWT_EXPIRES_IN
        value: 60m
      - key: JWT_REFRESH_EXPIRES_IN
        value: 7d

      # Google Gemini Generative AI
      - key: GEMINI_API_KEY
        sync: false
      - key: AI_MODEL
        value: gemini-2.5-flash

      # Real Market Feeds
      - key: FINNHUB_API_KEY
        sync: false
      - key: ALPHA_VANTAGE_API_KEY
        sync: false

      # Financial News Feeds
      - key: MARKETAUX_API_KEY
        sync: false
      - key: MARKETAUX_BASE_URL
        value: https://api.marketaux.com/v1

      # CORS & Client Origin
      - key: FRONTEND_URL
        value: https://finpro-finance-ai-olvt.onrender.com

      # Google OAuth
      - key: GOOGLE_CLIENT_ID
        sync: false
      - key: GOOGLE_CLIENT_SECRET
        sync: false
      - key: GOOGLE_REDIRECT_URI
        value: https://finpro-finance-ai-olvt.onrender.com/api/v1/auth/google/callback

      # Document & Receipt Storage Abstraction (Supabase Cloud Object Storage)
      - key: STORAGE_PROVIDER
        value: s3
      - key: S3_ENDPOINT
        value: https://qpnghccwcebrlgmjbibe.storage.supabase.co/storage/v1/s3
      - key: S3_REGION
        value: ap-northeast-2
      - key: S3_BUCKET
        value: finpro-documents
      - key: S3_ACCESS_KEY_ID
        sync: false
      - key: S3_SECRET_ACCESS_KEY
        sync: false
