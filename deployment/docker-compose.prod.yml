# ====================================================================
# FinPro — Production Docker Compose Stack
# Designed for Always Free Cloud VM (Oracle Cloud / Ubuntu Linux)
# Connects to Managed Cloud PostgreSQL & Cloud Object Storage
# ====================================================================

services:
  finpro_app:
    build:
      context: ..
      dockerfile: Dockerfile
    image: finpro:latest
    container_name: finpro_production_app
    restart: unless-stopped
    env_file:
      - ../.env
    environment:
      NODE_ENV: production
      PORT: 5000
    ports:
      - "127.0.0.1:5000:5000" # Bound to localhost only — reverse proxied by Nginx
    volumes:
      - finpro_uploads:/app/uploads
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://127.0.0.1:5000/api/v1/health/ready"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 15s

volumes:
  finpro_uploads:
    driver: local
