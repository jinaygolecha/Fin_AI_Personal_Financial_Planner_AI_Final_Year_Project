# ====================================================================
# FinPro — Production Nginx Reverse Proxy Configuration
# Target: Oracle Cloud Infrastructure Always Free VM / Ubuntu Linux
# ====================================================================

# Rate Limiting Zone: 20 requests per second per IP
limit_req_zone $binary_remote_addr zone=finpro_api_limit:10m rate=20r/s;

server {
    listen 80;
    listen [::]:80;
    server_name yourdomain.com www.yourdomain.com; # Replace with your VM IP or Domain

    # Allow Let's Encrypt ACME Challenge for Automated SSL Renewal
    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    # Redirect all HTTP traffic to HTTPS (uncomment when SSL certificate is generated)
    # location / {
    #     return 301 https://$host$request_uri;
    # }

    # Before SSL is configured, forward directly to FinPro application container:
    location / {
        proxy_pass http://127.0.0.1:5000;
        proxy_http_version 1.1;

        # WebSocket & Upgrade Headers (Required for Socket.io real-time updates)
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection 'upgrade';
        proxy_set_header Host $host;
        proxy_cache_bypass $http_upgrade;

        # Client IP & Protocol forwarding
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # Timeouts for OCR receipt processing and AI inferences
        proxy_connect_timeout 60s;
        proxy_send_timeout 60s;
        proxy_read_timeout 60s;

        # Maximum payload size (receipts, bills, documents)
        client_max_body_size 15M;
    }
}

