<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Budget & Income Management</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/echarts/5.5.0/echarts.min.js"></script>
    <link href="https://cdn.jsdelivr.net/npm/remixicon@2.5.0/fonts/remixicon.css" rel="stylesheet">
</head>
<body class="bg-gray-50 min-h-screen" onload="initializeDashboard()">
    <div class="max-w-7xl mx-auto px-4 py-8">
        <header class="flex justify-between items-center mb-8">
            <h1 class="text-2xl font-bold text-gray-900">Budget & Income Management</h1>
            <div class="flex items-center space-x-4">
                <button id="monthSelector" class="flex items-center px-4 py-2 bg-white border border-gray-200 rounded-lg hover:bg-gray-50 transition duration-300">
                    <span id="selectedMonth" class="text-lg font-medium"></span>
                    <i class="ri-arrow-down-s-line ml-2 w-5 h-5"></i>
                </button>
                <button onclick="exportData()" class="px-4 py-2 bg-white border border-gray-200 rounded-lg hover:bg-gray-50 transition duration-300">Export</button>
                <button onclick="toggleDarkMode()" class="px-4 py-2 bg-gray-800 text-white rounded-lg hover:bg-gray-700 transition duration-300">Dark Mode</button>
            </div>
        </header>
        
        <div class="grid grid-cols-12 gap-6">
            <!-- Income Section -->
            <div class="col-span-12 lg:col-span-4">
                <div class="bg-white rounded-xl p-6 shadow-sm border border-gray-100">
                    <h2 class="text-lg font-semibold text-gray-900 mb-2">Total Monthly Budget</h2>
                    <div id="totalBudget" class="text-center text-3xl font-bold text-indigo-600 my-4">₹0</div>
                    <p class="text-center text-sm text-gray-500 mb-6">Planned Expenses</p>
                    
                    <div id="budgetWarnings" class="space-y-2 mb-6 text-sm"></div>

                    <button id="openBudgetModalBtn" class="w-full bg-indigo-600 text-white py-3 rounded-xl font-medium hover:bg-indigo-700 transition">Set / Add Budget</button>
                </div>

                <!-- Budget Method Card -->
                <div class="bg-white rounded-xl p-6 shadow-sm border border-gray-100 mt-6">
                    <h3 class="font-semibold text-gray-900 mb-3">Active Budget Strategy</h3>
                    <select id="budgetStrategySelect" class="w-full p-3 border rounded-xl bg-gray-50 font-medium">
                        <option value="50/30/20">50/30/20 Rule (50% Needs, 30% Wants, 20% Savings)</option>
                        <option value="Zero-Based">Zero-Based Budgeting (Assign every ₹ a job)</option>
                        <option value="Custom">Custom Allocation</option>
                    </select>
                </div>
            </div>

            <!-- Expense Categories Breakdown -->
            <div class="col-span-12 lg:col-span-8">
                <div class="bg-white rounded-xl p-6 shadow-sm border border-gray-100">
                    <div class="flex justify-between items-center mb-6">
                        <h2 class="text-lg font-semibold text-gray-900">Category Budgets & Progress</h2>
                        <span class="text-xs font-semibold text-gray-500 bg-gray-100 px-3 py-1 rounded-full">Updated Live</span>
                    </div>
                    <div id="categoryBudgetList" class="space-y-6"></div>
                </div>
            </div>
        </div>
    </div>

    <!-- Set Budget Modal -->
    <div id="setBudgetModal" class="hidden fixed inset-0 bg-black bg-opacity-50 flex items-center justify-center z-50">
        <div class="bg-white rounded-2xl p-6 w-full max-w-md shadow-xl">
            <h3 class="text-lg font-bold text-gray-900 mb-4">Set Category Budget</h3>
            <div class="space-y-4">
                <div>
                    <label class="block text-sm font-medium text-gray-700 mb-1">Category Name</label>
                    <input type="text" id="budCategory" placeholder="e.g. Food & Grocery" class="w-full p-3 border rounded-xl" required>
                </div>
                <div>
                    <label class="block text-sm font-medium text-gray-700 mb-1">Monthly Limit (₹)</label>
                    <input type="number" id="budLimit" placeholder="10000" class="w-full p-3 border rounded-xl" required>
                </div>
            </div>
            <div class="flex justify-end space-x-3 mt-6">
                <button type="button" id="closeBudModal" class="px-5 py-2.5 bg-gray-200 text-gray-700 rounded-xl font-medium">Cancel</button>
                <button type="button" id="saveBudBtn" class="px-5 py-2.5 bg-indigo-600 hover:bg-indigo-700 text-white rounded-xl font-medium">Save Budget</button>
            </div>
        </div>
    </div>

    <script>
        const token = localStorage.getItem('access_token');
        if (!token) window.location.href = '/login/';

        const fmtINR = (val) => Number(val || 0).toLocaleString('en-IN', { style: 'currency', currency: 'INR' });

        document.getElementById('selectedMonth').textContent = new Date().toLocaleDateString('en-US', { month: 'long', year: 'numeric' });

        async function loadBudgets() {
            try {
                const res = await fetch('/api/transactions/budgets/', {
                    headers: { 'Authorization': `Bearer ${token}` }
                });

                if (res.ok) {
                    const data = await res.json();
                    const budgets = data.results || data;
                    renderBudgets(budgets);
                }
            } catch(e) { console.error(e); }
        }

        function renderBudgets(budgets) {
            const list = document.getElementById('categoryBudgetList');
            const warnings = document.getElementById('budgetWarnings');
            list.innerHTML = '';
            warnings.innerHTML = '';

            let totalLimit = 0;

            if (!budgets || budgets.length === 0) {
                list.innerHTML = `<p class="text-slate-500 text-sm text-center py-6">No budget categories configured yet. Click "Set / Add Budget" to create one.</p>`;
                document.getElementById('totalBudget').textContent = '₹0.00';
                return;
            }

            budgets.forEach(b => {
                const limit = parseFloat(b.monthly_limit || 0);
                const spent = parseFloat(b.spent || 0);
                totalLimit += limit;

                const percent = limit > 0 ? Math.min(100, Math.round((spent / limit) * 100)) : 0;
                let colorClass = 'bg-indigo-600';
                let statusText = `${percent}% Used`;

                if (percent >= 100) {
                    colorClass = 'bg-red-600';
                    statusText = 'EXCEEDED';
                    warnings.innerHTML += `<div class="p-2.5 bg-red-50 text-red-700 rounded-lg">⚠️ <strong>${b.category}</strong> has exceeded limit (${percent}%)</div>`;
                } else if (percent >= 90) {
                    colorClass = 'bg-red-500';
                    statusText = 'CRITICAL (90%+)';
                    warnings.innerHTML += `<div class="p-2.5 bg-red-50 text-red-700 rounded-lg">⚠️ <strong>${b.category}</strong> reached 90% budget capacity.</div>`;
                } else if (percent >= 75) {
                    colorClass = 'bg-amber-500';
                    statusText = 'WARNING (75%+)';
                    warnings.innerHTML += `<div class="p-2.5 bg-amber-50 text-amber-800 rounded-lg">⚡ <strong>${b.category}</strong> has used 75% of budget.</div>`;
                }

                const card = document.createElement('div');
                card.className = 'border border-gray-100 p-4 rounded-xl shadow-xs';
                card.innerHTML = `
                    <div class="flex justify-between items-center mb-2">
                        <span class="font-bold text-gray-900">${b.category}</span>
                        <span class="text-sm font-semibold ${percent >= 90 ? 'text-red-600' : 'text-gray-700'}">${fmtINR(spent)} / ${fmtINR(limit)} (${statusText})</span>
                    </div>
                    <div class="w-full bg-gray-100 h-3 rounded-full overflow-hidden">
                        <div class="${colorClass} h-full transition-all duration-300" style="width: ${percent}%;"></div>
                    </div>
                `;
                list.appendChild(card);
            });

            document.getElementById('totalBudget').textContent = fmtINR(totalLimit);
        }

        // Modal Controls
        const modal = document.getElementById('setBudgetModal');
        document.getElementById('openBudgetModalBtn').onclick = () => modal.classList.remove('hidden');
        document.getElementById('closeBudModal').onclick = () => modal.classList.add('hidden');

        document.getElementById('saveBudBtn').onclick = async () => {
            const category = document.getElementById('budCategory').value;
            const limit = document.getElementById('budLimit').value;

            if (!category || !limit || limit <= 0) {
                alert("Please enter a category name and valid limit.");
                return;
            }

            try {
                const res = await fetch('/api/transactions/budgets/', {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json',
                        'Authorization': `Bearer ${token}`
                    },
                    body: JSON.stringify({ category: category, monthly_limit: limit })
                });

                if (res.ok) {
                    modal.classList.add('hidden');
                    loadBudgets();
                } else {
                    alert("Failed to save budget.");
                }
            } catch(e) { console.error(e); }
        };

        function exportData() {
            window.location.href = '/api/transactions/export-csv/';
        }

        loadBudgets();
    </script>
</body>
</html>
