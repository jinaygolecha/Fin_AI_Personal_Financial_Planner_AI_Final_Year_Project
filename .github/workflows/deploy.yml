name: FinPro CD — Automated Cloud VM Deployment

on:
  push:
    branches: [ main ]
  workflow_dispatch:
  workflow_call:
    secrets:
      VM_HOST:
        description: 'Target Cloud VM Hostname or Public IP'
        required: false
      VM_SSH_KEY:
        description: 'Private SSH Key for authentication'
        required: false
      VM_USERNAME:
        description: 'SSH user account (default: ubuntu)'
        required: false
      VM_PORT:
        description: 'SSH daemon port (default: 22)'
        required: false

jobs:
  deploy:
    name: Deploy to Cloud Virtual Machine
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/main'

    steps:
      - name: 1. Checkout Source Code
        uses: actions/checkout@v4

      - name: 2. Check for Cloud VM Credentials
        id: check_credentials
        env:
          VM_HOST: ${{ secrets.VM_HOST }}
          VM_SSH_KEY: ${{ secrets.VM_SSH_KEY }}
          VM_USERNAME: ${{ secrets.VM_USERNAME }}
          VM_PORT: ${{ secrets.VM_PORT }}
        run: |
          if [ -z "$VM_HOST" ] || [ -z "$VM_SSH_KEY" ]; then
            echo "::notice ::Cloud VM deployment secrets (VM_HOST, VM_SSH_KEY) not present. Skipping remote SSH deploy step safely."
            echo "configured=false" >> "$GITHUB_OUTPUT"
          else
            echo "configured=true" >> "$GITHUB_OUTPUT"
            echo "vm_user=${VM_USERNAME:-ubuntu}" >> "$GITHUB_OUTPUT"
            echo "vm_port=${VM_PORT:-22}" >> "$GITHUB_OUTPUT"
          fi

      - name: 3. Execute Remote Deployment via SSH
        if: steps.check_credentials.outputs.configured == 'true'
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.VM_HOST }}
          username: ${{ steps.check_credentials.outputs.vm_user }}
          key: ${{ secrets.VM_SSH_KEY }}
          port: ${{ steps.check_credentials.outputs.vm_port }}
          script: |
            cd /opt/finpro
            chmod +x deployment/deploy.sh
            ./deployment/deploy.sh
