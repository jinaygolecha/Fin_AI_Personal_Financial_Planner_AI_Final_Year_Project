<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Financial Calendar - Jinay Finance AI</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://cdn.jsdelivr.net/npm/remixicon@3.5.0/fonts/remixicon.css" rel="stylesheet">
</head>
<body class="bg-slate-50 min-h-screen font-sans">
    <div class="max-w-7xl mx-auto px-6 py-8">
        <header class="flex justify-between items-center mb-8">
            <div>
                <h1 class="text-3xl font-bold text-slate-900">Financial Calendar & Reminders</h1>
                <p class="text-sm text-slate-500 mt-1">Track upcoming EMIs, SIPs, Bills, Insurance, and Goal deadlines</p>
            </div>
            <button id="openAddEventBtn" class="px-5 py-2.5 bg-indigo-600 hover:bg-indigo-700 text-white font-medium rounded-xl transition shadow-sm">
                <i class="ri-add-line mr-1"></i> Add Custom Reminder
            </button>
        </header>

        <!-- Events List -->
        <div class="bg-white rounded-2xl border border-slate-200 shadow-sm p-6">
            <h2 class="text-lg font-bold text-slate-900 mb-6 flex items-center justify-between">
                <span>Upcoming Financial Milestones</span>
                <span class="text-xs font-semibold text-indigo-600 bg-indigo-50 px-3 py-1 rounded-full">Asia/Kolkata (IST)</span>
            </h2>
            
            <div id="eventsContainer" class="space-y-4">
                <p class="text-center text-slate-400 py-6">Loading calendar schedule...</p>
            </div>
        </div>
    </div>

    <!-- Add Event Modal -->
    <div id="eventModal" class="hidden fixed inset-0 bg-black bg-opacity-50 flex items-center justify-center z-50">
        <div class="bg-white rounded-2xl p-6 w-full max-w-md shadow-xl">
            <h3 class="text-xl font-bold text-slate-900 mb-4">Add Calendar Event</h3>
            <div class="space-y-4">
                <div>
                    <label class="block text-sm font-medium text-slate-700 mb-1">Event Title</label>
                    <input type="text" id="evtTitle" placeholder="e.g. Broadband Bill Payment" class="w-full p-3 border rounded-xl" required>
                </div>
                <div>
                    <label class="block text-sm font-medium text-slate-700 mb-1">Category</label>
                    <select id="evtType" class="w-full p-3 border rounded-xl">
                        <option value="EMI">Loan EMI</option>
                        <option value="SIP">Investment SIP</option>
                        <option value="BILL">Utility Bill</option>
                        <option value="SUBSCRIPTION">Subscription</option>
                        <option value="OTHER">Custom Event</option>
                    </select>
                </div>
                <div>
                    <label class="block text-sm font-medium text-slate-700 mb-1">Amount (₹)</label>
                    <input type="number" id="evtAmount" placeholder="1500" class="w-full p-3 border rounded-xl">
                </div>
                <div>
                    <label class="block text-sm font-medium text-slate-700 mb-1">Due Date</label>
                    <input type="date" id="evtDate" class="w-full p-3 border rounded-xl" required>
                </div>
            </div>
            <div class="flex justify-end space-x-3 mt-6">
                <button type="button" id="closeEventModalBtn" class="px-5 py-2.5 bg-slate-200 text-slate-700 rounded-xl font-medium">Cancel</button>
                <button type="button" id="submitEventBtn" class="px-5 py-2.5 bg-indigo-600 hover:bg-indigo-700 text-white rounded-xl font-medium">Save Event</button>
            </div>
        </div>
    </div>

    <script>
        const token = localStorage.getItem('access_token');
        if (!token) window.location.href = '/login/';

        async function loadEvents() {
            try {
                const res = await fetch('/api/calendar/events/', {
                    headers: { 'Authorization': `Bearer ${token}` }
                });
                if (res.ok) {
                    const data = await res.json();
                    renderEvents(data.events);
                }
            } catch(e) { console.error(e); }
        }

        function renderEvents(events) {
            const container = document.getElementById('eventsContainer');
            container.innerHTML = '';

            if (!events || events.length === 0) {
                container.innerHTML = `<p class="text-center text-slate-400 py-6">No upcoming events or bills scheduled.</p>`;
                return;
            }

            events.forEach(evt => {
                let badgeColor = 'bg-indigo-50 text-indigo-700';
                if (evt.raw_type === 'EMI') badgeColor = 'bg-rose-50 text-rose-700';
                if (evt.raw_type === 'SIP') badgeColor = 'bg-emerald-50 text-emerald-700';
                if (evt.raw_type === 'BILL') badgeColor = 'bg-amber-50 text-amber-800';

                const card = document.createElement('div');
                card.className = 'p-4 rounded-xl border border-slate-100 flex items-center justify-between hover:bg-slate-50 transition';
                card.innerHTML = `
                    <div class="flex items-center space-x-4">
                        <div class="w-12 h-12 rounded-xl bg-slate-100 flex items-center justify-center font-bold text-slate-700">
                            <i class="ri-calendar-line text-xl"></i>
                        </div>
                        <div>
                            <h4 class="font-bold text-slate-900">${evt.title}</h4>
                            <div class="flex items-center space-x-2 mt-1 text-xs">
                                <span class="px-2.5 py-0.5 rounded-full font-semibold ${badgeColor}">${evt.event_type}</span>
                                <span class="text-slate-400">• Source: ${evt.source}</span>
                            </div>
                        </div>
                    </div>
                    <div class="text-right">
                        <div class="font-black text-slate-900 text-base">${evt.formatted_amount}</div>
                        <div class="text-xs text-slate-500 font-medium mt-0.5">Due: ${evt.date}</div>
                    </div>
                `;
                container.appendChild(card);
            });
        }

        // Modal Controls
        const modal = document.getElementById('eventModal');
        document.getElementById('openAddEventBtn').onclick = () => modal.classList.remove('hidden');
        document.getElementById('closeEventModalBtn').onclick = () => modal.classList.add('hidden');
        document.getElementById('evtDate').valueAsDate = new Date();

        document.getElementById('submitEventBtn').onclick = async () => {
            const payload = {
                title: document.getElementById('evtTitle').value,
                event_type: document.getElementById('evtType').value,
                amount: document.getElementById('evtAmount').value,
                event_date: document.getElementById('evtDate').value
            };

            try {
                const res = await fetch('/api/calendar/events/', {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json',
                        'Authorization': `Bearer ${token}`
                    },
                    body: JSON.stringify(payload)
                });
                if (res.ok) {
                    modal.classList.add('hidden');
                    loadEvents();
                } else {
                    alert("Failed to save event.");
                }
            } catch(e) { console.error(e); }
        };

        loadEvents();
    </script>
</body>
</html>
