<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>AI Advisor — Jinay Finance AI</title>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <link href="https://cdn.jsdelivr.net/npm/remixicon@4.5.0/fonts/remixicon.css" rel="stylesheet">
  <link rel="stylesheet" href="/assets/css/app.css">
  <style>
    .chat-container{display:flex;flex-direction:column;height:calc(100vh - 65px)}
    .chat-header{padding:14px 24px;border-bottom:1px solid var(--border);background:var(--surface);display:flex;align-items:center;gap:12px;flex-shrink:0}
    .ai-avatar{width:36px;height:36px;border-radius:50%;background:linear-gradient(135deg,#6366f1,#8b5cf6);display:flex;align-items:center;justify-content:center;font-size:18px}
    .ai-status{font-size:11px;color:#10b981}
    .chat-snapshot{padding:12px 24px;border-bottom:1px solid var(--border);background:rgba(99,102,241,.04);display:flex;gap:16px;overflow-x:auto;flex-shrink:0}
    .snapshot-item{flex-shrink:0;background:rgba(255,255,255,.05);border:1px solid var(--border);border-radius:10px;padding:8px 14px;font-size:12px;white-space:nowrap}
    .snapshot-val{font-weight:700;color:white;display:block;font-size:13px}
    .snapshot-lbl{color:#6b7280;font-size:10px}
    .messages-area{flex:1;overflow-y:auto;padding:20px 24px;display:flex;flex-direction:column;gap:16px}
    .msg{display:flex;gap:10px;max-width:75%}
    .msg.user{align-self:flex-end;flex-direction:row-reverse}
    .msg-avatar{width:28px;height:28px;border-radius:50%;flex-shrink:0;display:flex;align-items:center;justify-content:center;font-size:13px;font-weight:700;background:linear-gradient(135deg,#6366f1,#8b5cf6)}
    .msg.user .msg-avatar{background:linear-gradient(135deg,#10b981,#059669)}
    .msg-bubble{padding:12px 14px;border-radius:14px;font-size:13px;line-height:1.6;white-space:pre-wrap}
    .msg.ai .msg-bubble{background:rgba(255,255,255,.06);border:1px solid rgba(255,255,255,.08);color:var(--text);border-radius:4px 14px 14px 14px}
    .msg.user .msg-bubble{background:linear-gradient(135deg,rgba(99,102,241,.25),rgba(139,92,246,.2));border:1px solid rgba(99,102,241,.3);color:white;border-radius:14px 4px 14px 14px}
    .msg-time{font-size:10px;color:#6b7280;margin-top:4px;text-align:right}
    .input-area{padding:16px 24px;border-top:1px solid var(--border);background:var(--surface);flex-shrink:0}
    .input-row{display:flex;gap:10px;align-items:flex-end}
    .chat-input{flex:1;padding:10px 14px;background:rgba(255,255,255,.05);border:1px solid var(--border);border-radius:12px;color:var(--text);font-size:13px;font-family:'Inter',sans-serif;outline:none;resize:none;min-height:42px;max-height:120px;line-height:1.5;transition:border-color .2s}
    .chat-input:focus{border-color:var(--primary)}
    .chat-input::placeholder{color:#6b7280}
    .send-btn{width:40px;height:40px;border-radius:10px;background:linear-gradient(135deg,#6366f1,#8b5cf6);border:none;color:white;cursor:pointer;display:flex;align-items:center;justify-content:center;font-size:16px;transition:all .2s;flex-shrink:0}
    .send-btn:hover:not(:disabled){transform:scale(1.05)}
    .send-btn:disabled{opacity:.6;cursor:not-allowed}
    .quick-btns{display:flex;gap:8px;overflow-x:auto;padding-bottom:8px;margin-bottom:8px}
    .quick-btn{flex-shrink:0;padding:6px 12px;background:rgba(99,102,241,.1);border:1px solid rgba(99,102,241,.2);border-radius:20px;color:#a5b4fc;font-size:11px;font-weight:500;cursor:pointer;font-family:'Inter',sans-serif;white-space:nowrap;transition:all .2s}
    .quick-btn:hover{background:rgba(99,102,241,.2);color:white}
    .typing{display:flex;gap:4px;align-items:center;padding:8px}
    .dot{width:6px;height:6px;border-radius:50%;background:#6366f1;animation:bounce .8s infinite;opacity:.7}
    .dot:nth-child(2){animation-delay:.15s}
    .dot:nth-child(3){animation-delay:.3s}
    @keyframes bounce{0%,100%{transform:translateY(0)}50%{transform:translateY(-4px)}}
  </style>
</head>
<body>
  <div id="sidebarRoot"></div>
  <main class="main-content">
    <div class="chat-container">
      <!-- Header -->
      <div class="chat-header">
        <div class="ai-avatar"><i class="ri-robot-line"></i></div>
        <div>
          <div style="font-size:14px;font-weight:700">AI Financial Advisor</div>
          <div class="ai-status">● Online · Using your real financial data</div>
        </div>
        <div style="margin-left:auto;display:flex;gap:8px">
          <button class="btn-icon-only" onclick="clearHistory()" title="Clear History"><i class="ri-delete-bin-line"></i></button>
          <button class="btn-icon-only" onclick="loadSnapshot()" title="Refresh Data"><i class="ri-refresh-line"></i></button>
        </div>
      </div>

      <!-- Financial Snapshot Bar -->
      <div class="chat-snapshot" id="snapshotBar">
        <div class="snapshot-item"><span class="snapshot-val" id="snapBalance">...</span><span class="snapshot-lbl">Balance</span></div>
        <div class="snapshot-item"><span class="snapshot-val" id="snapIncome">...</span><span class="snapshot-lbl">Monthly Income</span></div>
        <div class="snapshot-item"><span class="snapshot-val" id="snapExpense">...</span><span class="snapshot-lbl">Monthly Expenses</span></div>
        <div class="snapshot-item"><span class="snapshot-val" id="snapSavings">...</span><span class="snapshot-lbl">Savings Rate</span></div>
        <div class="snapshot-item"><span class="snapshot-val" id="snapScore">...</span><span class="snapshot-lbl">Health Score</span></div>
      </div>

      <!-- Messages -->
      <div class="messages-area" id="messagesArea">
        <!-- Welcome message injected by JS -->
      </div>

      <!-- Input -->
      <div class="input-area">
        <div class="quick-btns">
          <button class="quick-btn" onclick="sendQuick('How much did I spend on food this month?')">Food spending</button>
          <button class="quick-btn" onclick="sendQuick('What is my savings rate and is it good?')">Savings rate</button>
          <button class="quick-btn" onclick="sendQuick('How can I reduce my expenses?')">Cut expenses</button>
          <button class="quick-btn" onclick="sendQuick('What investment should I start with?')">Invest advice</button>
          <button class="quick-btn" onclick="sendQuick('Am I on track with my financial goals?')">Goal progress</button>
          <button class="quick-btn" onclick="sendQuick('What is my financial health score and how to improve it?')">Health score</button>
        </div>
        <div class="input-row">
          <textarea id="chatInput" class="chat-input" placeholder="Ask me anything about your finances... e.g. 'How much did I spend on food?' or 'Should I invest in mutual funds?'" rows="1" onkeydown="handleKey(event)"></textarea>
          <button class="send-btn" id="sendBtn" onclick="sendMessage()"><i class="ri-send-plane-fill"></i></button>
        </div>
      </div>
    </div>
  </main>

  <script>
    const API_BASE = window.location.origin.includes(':5000') ? '/api/v1' : 'http://127.0.0.1:5000/api/v1';
    const token = localStorage.getItem('jf_access_token');
    if (!token) window.location.href = '/login.html';
    const fmt = (v) => new Intl.NumberFormat('en-IN',{style:'currency',currency:'INR',maximumFractionDigits:0}).format(v||0);
    const apiFetch = async (url, opts={}) => {
      const r = await fetch(`${API_BASE}${url}`,{headers:{'Content-Type':'application/json',Authorization:`Bearer ${token}`,...(opts.headers||{})},...opts});
      if(r.status===401){localStorage.clear();window.location.href='/login.html';return null;}
      return r.json();
    };

    document.getElementById('sidebarRoot').innerHTML = getSidebar('ai-advisor');
    initSidebarUser();

    const area = document.getElementById('messagesArea');
    const user = JSON.parse(localStorage.getItem('jf_user') || '{}');
    const name = user.firstName || user.username || 'there';

    const addMsg = (role, text) => {
      const div = document.createElement('div');
      div.className = `msg ${role}`;
      const time = new Date().toLocaleTimeString('en-IN', {hour:'2-digit',minute:'2-digit'});
      if (role === 'ai') {
        div.innerHTML = `<div class="msg-avatar"><i class="ri-robot-line"></i></div><div><div class="msg-bubble">${text}</div><div class="msg-time">${time}</div></div>`;
      } else {
        div.innerHTML = `<div class="msg-avatar">${name[0].toUpperCase()}</div><div><div class="msg-bubble">${text}</div><div class="msg-time">${time}</div></div>`;
      }
      area.appendChild(div);
      area.scrollTop = area.scrollHeight;
      return div;
    };

    const showTyping = () => {
      const div = document.createElement('div');
      div.className = 'msg ai';
      div.id = 'typingIndicator';
      div.innerHTML = `<div class="msg-avatar"><i class="ri-robot-line"></i></div><div class="msg-bubble typing"><div class="dot"></div><div class="dot"></div><div class="dot"></div></div>`;
      area.appendChild(div);
      area.scrollTop = area.scrollHeight;
    };

    const hideTyping = () => {
      const el = document.getElementById('typingIndicator');
      if (el) el.remove();
    };

    const sendMessage = async () => {
      const input = document.getElementById('chatInput');
      const text = input.value.trim();
      if (!text) return;

      addMsg('user', text);
      input.value = '';
      input.style.height = 'auto';
      document.getElementById('sendBtn').disabled = true;
      showTyping();

      const res = await apiFetch('/ai/chat', { method: 'POST', body: JSON.stringify({ message: text }) });
      hideTyping();
      document.getElementById('sendBtn').disabled = false;

      if (res?.success) {
        addMsg('ai', res.data.response || 'I could not generate a response. Please try again.');
      } else {
        addMsg('ai', res?.error?.message || '⚠️ Unable to get AI response. The AI service may not be configured. Please add your GEMINI_API_KEY to .env to enable full AI capabilities.');
      }
    };

    const sendQuick = (text) => {
      document.getElementById('chatInput').value = text;
      sendMessage();
    };

    const handleKey = (e) => {
      if (e.key === 'Enter' && !e.shiftKey) { e.preventDefault(); sendMessage(); }
    };

    const loadSnapshot = async () => {
      const res = await apiFetch('/ai/snapshot');
      if (res?.success) {
        const d = res.data;
        document.getElementById('snapBalance').textContent = fmt(d.totalBalance);
        document.getElementById('snapIncome').textContent = fmt(d.monthlyIncome);
        document.getElementById('snapExpense').textContent = fmt(d.monthlyExpenses);
        document.getElementById('snapSavings').textContent = (d.savingsRate || 0) + '%';
        document.getElementById('snapScore').textContent = (d.financialHealthScore || 0) + '/100';
      }
    };

    const clearHistory = async () => {
      if (!confirm('Clear all chat history?')) return;
      await apiFetch('/ai/history', { method: 'DELETE' });
      area.innerHTML = '';
      addMsg('ai', `Chat history cleared. How can I help you with your finances, ${name}?`);
    };

    // Load history
    const loadHistory = async () => {
      const res = await apiFetch('/ai/history');
      if (res?.success && res.data.messages?.length) {
        res.data.messages.slice(-20).forEach(m => addMsg(m.role === 'user' ? 'user' : 'ai', m.content));
      } else {
        addMsg('ai', `Hello, ${name}! 👋 I'm your AI Financial Advisor. I have access to your real financial data and can answer questions about your spending, savings, investments, and more.\n\nTry asking me:\n• "How much did I spend this month?"\n• "What's my savings rate?"\n• "Am I on track with my goals?"\n• "How can I improve my financial health score?"`);
      }
    };

    // Auto-resize textarea
    document.getElementById('chatInput').addEventListener('input', function() {
      this.style.height = 'auto';
      this.style.height = Math.min(this.scrollHeight, 120) + 'px';
    });

    function getSidebar(active){const nav=[['dashboard','ri-dashboard-line','Dashboard'],['transactions','ri-exchange-line','Transactions'],['budget','ri-pie-chart-line','Budgets'],['goals','ri-flag-line','Goals'],['investments','ri-stock-line','Portfolio'],['loans','ri-bank-line','Loans & EMI'],['calendar','ri-calendar-line','Calendar'],['analytics','ri-bar-chart-line','Analytics'],['ai-advisor','ri-robot-line','AI Advisor']];return `<aside class="sidebar"><div class="sidebar-brand"><div class="brand-icon"><i class="ri-line-chart-line"></i></div><div><div class="brand-text">Jinay Finance AI</div><div class="brand-sub">by Jinay Golecha</div></div></div><div class="nav-section" style="margin-top:8px">${nav.map(([href,icon,label])=>`<a href="/${href}.html" class="nav-item${active===href?' active':''}"><i class="${icon}"></i>${label}</a>`).join('')}</div><div class="sidebar-footer"><div class="user-info"><div class="avatar" id="sidebarAvatar">J</div><div><div class="user-name" id="sidebarUserName">User</div><div class="user-role" id="sidebarUserRole">Free</div></div><i class="ri-logout-box-line logout-btn" id="sidebarLogout" title="Logout"></i></div></div></aside>`;}
    function initSidebarUser(){const user=JSON.parse(localStorage.getItem('jf_user')||'{}');const name=user.firstName||user.username||'User';const el=document.getElementById('sidebarUserName'),rl=document.getElementById('sidebarUserRole'),av=document.getElementById('sidebarAvatar');if(el)el.textContent=name+(user.lastName?' '+user.lastName:'');if(rl)rl.textContent=user.isPremium?'⭐ Premium':'Free User';if(av)av.textContent=name[0].toUpperCase();document.getElementById('sidebarLogout').onclick=async()=>{const rt=localStorage.getItem('jf_refresh_token');try{await fetch(`${API_BASE}/auth/logout`,{method:'POST',headers:{'Content-Type':'application/json',Authorization:`Bearer ${token}`},body:JSON.stringify({refreshToken:rt})});}catch{}localStorage.clear();window.location.href='/login.html';};}

    loadHistory();
    loadSnapshot();
  </script>
</body>
</html>
