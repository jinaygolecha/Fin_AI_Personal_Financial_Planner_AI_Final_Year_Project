<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Transactions</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/echarts/5.5.0/echarts.min.js"></script>
    <link href="https://cdn.jsdelivr.net/npm/remixicon@4.5.0/fonts/remixicon.css" rel="stylesheet">
    <style>
        /* Custom styles for the chart container */
        #chartContainer {
            height: 400px;
        }
    </style>
</head>
<body class="bg-gray-100 min-h-screen">
    <div class="max-w-7xl mx-auto px-4 py-8">
        <!-- Header -->
        <div class="flex justify-between items-center mb-8">
            <h1 class="text-2xl font-bold text-gray-800">Transactions</h1>
            <div class="flex gap-3">
                <button id="voiceBtn" class="px-4 py-2 bg-green-600 text-white rounded-lg hover:bg-green-700 transition duration-200">
                    <i class="ri-mic-line"></i> Voice Input
                </button>
                <button id="addTransactionBtn" class="px-4 py-2 bg-blue-600 text-white rounded-lg hover:bg-blue-700 transition duration-200">
                    <i class="ri-add-line"></i> Add Transaction
                </button>
                <button id="exportCsvBtn" class="px-4 py-2 bg-gray-600 text-white rounded-lg hover:bg-gray-700 transition duration-200">
                    <i class="ri-download-line"></i> Export CSV
                </button>
            </div>
        </div>

        <!-- Chart -->
        <div class="bg-white rounded-xl shadow-lg p-6 mb-8">
            <h2 class="text-lg font-semibold text-gray-800 mb-4">Transaction Trends</h2>
            <div id="chartContainer"></div>
        </div>

        <!-- Filters -->
        <div class="bg-white rounded-xl shadow-lg p-6 mb-8">
            <h2 class="text-lg font-semibold text-gray-800 mb-4">Filters</h2>
            <div class="grid grid-cols-1 md:grid-cols-4 gap-4">
                <input type="date" id="filterDate" class="p-2 border rounded-lg focus:outline-none focus:ring-2 focus:ring-blue-500">
                <select id="filterCategory" class="p-2 border rounded-lg focus:outline-none focus:ring-2 focus:ring-blue-500">
                    <option value="">All Categories</option>
                </select>
                <input type="number" id="filterAmount" class="p-2 border rounded-lg focus:outline-none focus:ring-2 focus:ring-blue-500" placeholder="Min Amount">
                <input type="text" id="searchText" class="p-2 border rounded-lg focus:outline-none focus:ring-2 focus:ring-blue-500" placeholder="Search Description">
            </div>
            <button onclick="fetchTransactions()" class="mt-4 px-4 py-2 bg-blue-600 text-white rounded-lg hover:bg-blue-700 transition duration-200">
                <i class="ri-filter-line"></i> Apply Filters
            </button>
        </div>

        <!-- Transactions Table -->
        <div class="bg-white rounded-xl shadow-lg p-6">
            <h2 class="text-lg font-semibold text-gray-800 mb-4">Transaction History</h2>
            <table class="w-full">
                <thead>
                    <tr class="border-b">
                        <th class="py-4 px-6 text-left text-gray-700 font-medium cursor-pointer hover:bg-gray-50" onclick="sortTransactions('date')">Date</th>
                        <th class="py-4 px-6 text-left text-gray-700 font-medium cursor-pointer hover:bg-gray-50" onclick="sortTransactions('category')">Category</th>
                        <th class="py-4 px-6 text-right text-gray-700 font-medium cursor-pointer hover:bg-gray-50" onclick="sortTransactions('amount')">Amount</th>
                        <th class="py-4 px-6 text-left text-gray-700 font-medium">Currency</th>
                        <th class="py-4 px-6 text-left text-gray-700 font-medium">Description</th>
                        <th class="py-4 px-6 text-center text-gray-700 font-medium">Actions</th>
                    </tr>
                </thead>
                <tbody id="transactionsList" class="divide-y">
                    <!-- Transactions will be dynamically inserted here -->
                </tbody>
            </table>
        </div>

        <!-- Pagination -->
        <div class="flex justify-between mt-6">
            <button onclick="changePage(-1)" class="px-4 py-2 bg-gray-200 text-gray-700 rounded-lg hover:bg-gray-300 transition duration-200">
                <i class="ri-arrow-left-line"></i> Previous
            </button>
            <button onclick="changePage(1)" class="px-4 py-2 bg-gray-200 text-gray-700 rounded-lg hover:bg-gray-300 transition duration-200">
                Next <i class="ri-arrow-right-line"></i>
            </button>
        </div>
    </div>

    <!-- Add Transaction Modal -->
    <div id="addTransactionModal" class="hidden fixed inset-0 bg-black bg-opacity-50 flex items-center justify-center">
        <div class="bg-white rounded-xl w-full max-w-md p-6">
            <h3 class="text-lg font-semibold text-gray-800 mb-4">Add Transaction</h3>
            <form id="transactionForm" class="space-y-4">
                <input type="date" id="transactionDate" class="w-full p-2 border rounded-lg focus:outline-none focus:ring-2 focus:ring-blue-500" required>
                <select id="transactionCategory" class="w-full p-2 border rounded-lg focus:outline-none focus:ring-2 focus:ring-blue-500" required></select>
                <input type="number" id="transactionAmount" class="w-full p-2 border rounded-lg focus:outline-none focus:ring-2 focus:ring-blue-500" placeholder="Amount" required>
                <select id="transactionCurrency" class="w-full p-2 border rounded-lg focus:outline-none focus:ring-2 focus:ring-blue-500" required>
                    <option value="INR" selected>INR - Indian Rupee (₹)</option>
                </select>
                <textarea id="transactionDescription" class="w-full p-2 border rounded-lg focus:outline-none focus:ring-2 focus:ring-blue-500" placeholder="Description"></textarea>
                <div class="flex justify-end gap-2">
                    <button type="button" id="closeModal" class="px-4 py-2 border rounded-lg hover:bg-gray-100 transition duration-200">Cancel</button>
                    <button type="submit" class="px-4 py-2 bg-blue-600 text-white rounded-lg hover:bg-blue-700 transition duration-200">Save</button>
                </div>
            </form>
        </div>
    </div>

    <!-- Voice Confirmation Modal -->
    <div id="voiceModal" class="hidden fixed inset-0 bg-black bg-opacity-50 flex items-center justify-center z-50">
        <div class="bg-white rounded-xl w-full max-w-md p-6">
            <h3 class="text-lg font-semibold text-gray-800 mb-2">Voice Input Detected</h3>
            <p id="voiceRawText" class="text-xs text-gray-500 italic mb-4 bg-gray-50 p-2 rounded"></p>
            <div class="space-y-3 text-sm">
                <div><strong>Amount:</strong> ₹<span id="voiceAmount">0</span></div>
                <div><strong>Category:</strong> <span id="voiceCategory">General</span></div>
                <div><strong>Type:</strong> <span id="voiceType">expense</span></div>
            </div>
            <div class="flex justify-end gap-2 mt-6">
                <button type="button" id="cancelVoice" class="px-4 py-2 border rounded-lg hover:bg-gray-100">Cancel</button>
                <button type="button" id="confirmVoice" class="px-4 py-2 bg-green-600 text-white rounded-lg hover:bg-green-700">Confirm & Save</button>
            </div>
        </div>
    </div>

    <script>
        const token = localStorage.getItem('access_token');
        if (!token) window.location.href = '/login/';

        let transactionsData = [];

        async function fetchTransactions() {
            try {
                const date = document.getElementById('filterDate').value;
                const category = document.getElementById('filterCategory').value;
                const minAmount = document.getElementById('filterAmount').value;

                let url = '/api/transactions/list-create/?';
                if (date) url += `date=${date}&`;
                if (category) url += `category=${category}&`;
                if (minAmount) url += `min_amount=${minAmount}&`;

                const res = await fetch(url, {
                    headers: { 'Authorization': `Bearer ${token}` }
                });

                if (res.ok) {
                    const data = await res.json();
                    transactionsData = data.results || data;
                    renderTable(transactionsData);
                    renderChart(transactionsData);
                }
            } catch (e) {
                console.error("Error loading transactions", e);
            }
        }

        function renderTable(list) {
            const tbody = document.getElementById('transactionsList');
            tbody.innerHTML = '';

            if (!list || list.length === 0) {
                tbody.innerHTML = `<tr><td colspan="6" class="py-8 text-center text-gray-500">No transactions recorded yet.</td></tr>`;
                return;
            }

            list.forEach(t => {
                const fmtAmount = Number(t.amount).toLocaleString('en-IN', { style: 'currency', currency: 'INR' });
                const isExpense = t.category_type === 'expense';
                const row = document.createElement('tr');
                row.className = 'border-b hover:bg-gray-50';
                row.innerHTML = `
                    <td class="py-4 px-6 text-sm text-gray-600">${t.date}</td>
                    <td class="py-4 px-6 text-sm font-medium text-gray-800">${t.category_name || t.category || 'General'}</td>
                    <td class="py-4 px-6 text-sm font-bold text-right ${isExpense ? 'text-red-600' : 'text-green-600'}">
                        ${isExpense ? '-' : '+'}${fmtAmount}
                    </td>
                    <td class="py-4 px-6 text-sm text-gray-500">${t.currency || 'INR'}</td>
                    <td class="py-4 px-6 text-sm text-gray-600">${t.description || '-'}</td>
                    <td class="py-4 px-6 text-center">
                        <button onclick="deleteTx(${t.id})" class="text-red-500 hover:text-red-700 text-sm"><i class="ri-delete-bin-line"></i></button>
                    </td>
                `;
                tbody.appendChild(row);
            });
        }

        function renderChart(list) {
            const chartDom = document.getElementById('chartContainer');
            if (!chartDom) return;
            const myChart = echarts.init(chartDom);
            
            const dates = list.map(t => t.date).reverse();
            const amounts = list.map(t => parseFloat(t.amount)).reverse();

            const option = {
                tooltip: { trigger: 'axis' },
                xAxis: { type: 'category', data: dates },
                yAxis: { type: 'value', axisLabel: { formatter: '₹{value}' } },
                series: [{ data: amounts, type: 'line', smooth: true, color: '#4F46E5' }]
            };
            myChart.setOption(option);
        }

        async function deleteTx(id) {
            if (!confirm("Are you sure you want to delete this transaction?")) return;
            try {
                const res = await fetch(`/api/transactions/detail/${id}/`, {
                    method: 'DELETE',
                    headers: { 'Authorization': `Bearer ${token}` }
                });
                if (res.ok) fetchTransactions();
            } catch(e) { console.error(e); }
        }

        // Add Transaction Modal controls
        const modal = document.getElementById('addTransactionModal');
        document.getElementById('addTransactionBtn').onclick = () => modal.classList.remove('hidden');
        document.getElementById('closeModal').onclick = () => modal.classList.add('hidden');

        document.getElementById('transactionForm').onsubmit = async (e) => {
            e.preventDefault();
            const payload = {
                date: document.getElementById('transactionDate').value,
                amount: document.getElementById('transactionAmount').value,
                currency: 'INR',
                description: document.getElementById('transactionDescription').value,
                category_type: 'expense'
            };

            try {
                const res = await fetch('/api/transactions/list-create/', {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json',
                        'Authorization': `Bearer ${token}`
                    },
                    body: JSON.stringify(payload)
                });
                if (res.ok) {
                    modal.classList.add('hidden');
                    fetchTransactions();
                } else {
                    alert("Failed to save transaction.");
                }
            } catch(err) { console.error(err); }
        };

        // Export CSV
        document.getElementById('exportCsvBtn').onclick = () => {
            window.location.href = `/api/transactions/export-csv/`;
        };

        // Voice Input (Web Speech API)
        const voiceBtn = document.getElementById('voiceBtn');
        const voiceModal = document.getElementById('voiceModal');
        let parsedVoiceData = null;

        if ('SpeechRecognition' in window || 'webkitSpeechRecognition' in window) {
            const SpeechRecognition = window.SpeechRecognition || window.webkitSpeechRecognition;
            const recognition = new SpeechRecognition();
            recognition.lang = 'en-IN';

            voiceBtn.onclick = () => {
                voiceBtn.innerHTML = `<i class="ri-mic-fill text-red-500 animate-pulse"></i> Listening...`;
                recognition.start();
            };

            recognition.onresult = async (event) => {
                const text = event.results[0][0].transcript;
                voiceBtn.innerHTML = `<i class="ri-mic-line"></i> Voice Input`;
                
                // Process via Backend API
                try {
                    const res = await fetch('/api/transactions/process-voice/', {
                        method: 'POST',
                        headers: {
                            'Content-Type': 'application/json',
                            'Authorization': `Bearer ${token}`
                        },
                        body: JSON.stringify({ voice_text: text })
                    });
                    if (res.ok) {
                        parsedVoiceData = await res.json();
                        document.getElementById('voiceRawText').textContent = `"${text}"`;
                        document.getElementById('voiceAmount').textContent = parsedVoiceData.suggested_amount;
                        document.getElementById('voiceCategory').textContent = parsedVoiceData.suggested_category;
                        document.getElementById('voiceType').textContent = parsedVoiceData.suggested_type;
                        voiceModal.classList.remove('hidden');
                    }
                } catch(e) { console.error(e); }
            };

            recognition.onerror = () => {
                voiceBtn.innerHTML = `<i class="ri-mic-line"></i> Voice Input`;
                alert("Voice recognition error or microphone permission denied.");
            };
        } else {
            voiceBtn.onclick = () => alert("Web Speech API is not supported in this browser. Please use manual entry.");
        }

        document.getElementById('cancelVoice').onclick = () => voiceModal.classList.add('hidden');
        document.getElementById('confirmVoice').onclick = async () => {
            if (!parsedVoiceData) return;
            try {
                const res = await fetch('/api/transactions/confirm-voice/', {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json',
                        'Authorization': `Bearer ${token}`
                    },
                    body: JSON.stringify({
                        amount: parsedVoiceData.suggested_amount,
                        category: parsedVoiceData.suggested_category,
                        category_type: parsedVoiceData.suggested_type,
                        description: `Voice: ${parsedVoiceData.voice_text}`
                    })
                });
                if (res.ok) {
                    voiceModal.classList.add('hidden');
                    fetchTransactions();
                }
            } catch(e) { console.error(e); }
        };

        // Initial Load
        document.getElementById('transactionDate').valueAsDate = new Date();
        fetchTransactions();
    </script>
</body>
</html>
